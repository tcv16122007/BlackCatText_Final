<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Cat Text</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="flex items-center justify-center min-h-screen p-4 relative overflow-hidden bg-[#0f172a]">

  <!-- Nền Orbs LUÔN HIỂN THỊ (Kể cả khi Chat) -->
  <div id="bg-orbs" class="absolute inset-0 z-0">
    <div
      class="absolute top-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-cyan-500 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-float">
    </div>
    <div
      class="absolute top-[20%] right-[-10%] w-[30rem] h-[30rem] bg-purple-600 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-float animation-delay-2000">
    </div>
    <div
      class="absolute bottom-[-20%] left-[20%] w-[30rem] h-[30rem] bg-pink-600 rounded-full mix-blend-screen filter blur-[100px] opacity-20 animate-float animation-delay-4000">
    </div>
  </div>

  <!-- ================= FORM ĐĂNG NHẬP / ĐĂNG KÝ ================= -->
  <div id="auth-container" class="glass-panel w-full max-w-md p-8 relative z-10">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-extrabold mb-2 tracking-tight text-glow">Black Cat Text</h1>
      <p id="auth-subtitle" class="text-gray-400 text-sm tracking-wide">Đăng nhập để tiếp tục trò chuyện</p>
    </div>

    <form id="login-form" class="space-y-5">
      <div>
        <label class="block text-sm font-medium mb-1 text-cyan-100">Username</label>
        <input type="text" id="login-username" required class="glass-input" placeholder="Nhập username...">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-cyan-100">Mật khẩu</label>
        <div class="relative">
          <input type="password" id="login-password" required class="glass-input pr-12" placeholder="Nhập mật khẩu...">
          <button type="button"
            class="toggle-password absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-cyan-300">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
              </path>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit"
        class="w-full bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.4)] transition-all duration-300 transform hover:-translate-y-0.5 mt-2">
        Đăng nhập
      </button>
    </form>

    <form id="register-form" class="space-y-4 hidden">
      <div>
        <label class="block text-sm font-medium mb-1 text-cyan-100">Username</label>
        <input type="text" id="reg-username" required class="glass-input" placeholder="Tạo username...">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-cyan-100">Email</label>
        <input type="email" id="reg-email" required class="glass-input" placeholder="Nhập email...">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-cyan-100">Mật khẩu</label>
        <input type="password" id="reg-password" required class="glass-input" placeholder="Tạo mật khẩu...">
      </div>
      <button type="submit"
        class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-[0_0_20px_rgba(192,38,211,0.4)] transition-all duration-300 transform hover:-translate-y-0.5 mt-2">
        Đăng ký
      </button>
    </form>

    <div class="text-center text-sm text-gray-400 mt-6">
      <span id="toggle-text">Chưa có tài khoản?</span>
      <button id="toggle-auth-btn"
        class="text-cyan-400 font-semibold hover:text-cyan-300 hover:underline transition-colors ml-1">Đăng ký
        ngay</button>
    </div>
  </div>

  <!-- ================= GIAO DIỆN CHAT (PHONG CÁCH KÍNH MỜ) ================= -->
  <div id="chat-container"
    class="hidden fixed inset-0 w-full h-full z-20 flex overflow-hidden bg-[#0f172a]/60 backdrop-blur-3xl">

    <!-- Sidebar -->
    <div class="w-80 flex-shrink-0 border-r border-white/10 flex flex-col bg-white/5">
      <!-- Header Sidebar -->
      <div class="h-20 px-5 border-b border-white/10 flex justify-between items-center bg-white/5">
        <div class="flex items-center gap-3">
          <div
            class="w-11 h-11 rounded-full bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center font-bold text-lg text-white shadow-[0_0_15px_rgba(6,182,212,0.5)]"
            id="user-avatar">U</div>
          <div>
            <h2 class="font-bold text-white text-[15px]" id="display-username">User</h2>
            <p class="text-[12px] text-green-400 flex items-center gap-1.5 mt-0.5">
              <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Online
            </p>
          </div>
        </div>
        <button id="logout-btn"
          class="text-gray-400 hover:text-red-400 transition-colors p-2 rounded-xl hover:bg-white/10" title="Đăng xuất">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
        </button>
      </div>

      <!-- Thanh tìm kiếm -->
      <div class="p-4">
        <div class="relative">
          <svg class="w-4 h-4 absolute left-3 top-3 text-gray-400" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text"
            class="w-full bg-black/20 border border-white/10 focus:border-cyan-500/50 rounded-xl pl-9 pr-4 py-2.5 text-sm text-white placeholder-gray-400 transition-all outline-none"
            placeholder="Tìm kiếm...">
        </div>
      </div>

      <!-- Danh sách phòng chat -->
      <div class="flex-1 overflow-y-auto px-3 py-2 space-y-2 custom-scrollbar">
        <!-- Item Active -->
        <div
          class="p-3 rounded-xl bg-white/10 border border-white/10 cursor-pointer flex items-center gap-3 relative overflow-hidden shadow-lg group hover:bg-white/15 transition-all">
          <div
            class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-cyan-400 to-purple-500 shadow-[0_0_10px_rgba(6,182,212,0.8)]">
          </div>
          <div
            class="w-12 h-12 rounded-full bg-black/40 border border-white/20 flex items-center justify-center font-bold text-white text-xl">
            #</div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline mb-1">
              <h3 class="font-semibold text-white text-sm truncate">Phòng Chat Chung</h3>
            </div>
            <p class="text-[13px] text-gray-400 truncate group-hover:text-gray-300 transition-colors">Nơi mọi người trò
              chuyện</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Vùng Chat Chính -->
    <div class="flex-1 flex flex-col relative min-w-0 bg-white/5">
      <!-- Header Chat -->
      <div
        class="h-20 px-6 border-b border-white/10 flex items-center gap-4 bg-white/5 backdrop-blur-md z-10 shadow-sm">
        <div
          class="w-11 h-11 rounded-full bg-black/40 border border-white/20 flex items-center justify-center font-bold text-white text-lg">
          #</div>
        <div>
          <h2 class="font-bold text-glow text-lg">Phòng Chat Chung</h2>
          <p class="text-[12px] text-gray-400 mt-0.5">Tất cả mọi người đều có thể xem</p>
        </div>
      </div>

      <!-- Khung hiển thị tin nhắn -->
      <div id="message-area" class="flex-1 p-6 overflow-y-auto flex flex-col gap-5 z-10 custom-scrollbar"></div>

      <!-- Khung nhập tin nhắn -->
      <div class="p-5 bg-white/5 border-t border-white/10 z-10">
        <form id="message-form" class="flex items-end gap-3 max-w-5xl mx-auto w-full">
          <button type="button"
            class="p-3 rounded-full bg-white/10 text-gray-300 hover:text-cyan-400 hover:bg-white/20 transition-colors mb-0.5 border border-white/10">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6">
              </path>
            </svg>
          </button>

          <div
            class="flex-1 bg-black/30 rounded-3xl border border-white/10 focus-within:border-cyan-500/50 focus-within:bg-black/50 transition-all flex items-center pr-2 shadow-inner">
            <input type="text" id="message-input"
              class="w-full bg-transparent px-5 py-3.5 text-white placeholder-gray-400 focus:outline-none"
              placeholder="Nhập tin nhắn..." autocomplete="off">
            <button type="submit"
              class="p-2.5 bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white rounded-full transition-all shadow-[0_0_15px_rgba(6,182,212,0.5)] flex-shrink-0 transform hover:scale-105">
              <svg class="w-5 h-5 translate-x-[1px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
              </svg>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
